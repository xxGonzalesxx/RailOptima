services:
  postgres:
    image: postgres:18-alpine
    container_name: railoptima-db
    environment:
      POSTGRES_DB: railoptima
      POSTGRES_USER: railuser
      POSTGRES_PASSWORD: railpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
