
quarkus:
  application:
    name: railoptima

  http:
    port: 8080
    cors:
      enabled: true
      origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
      methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
      headers: Authorization,Content-Type,Cache-Control
      exposed-headers: Authorization

  datasource:
    db-kind: postgresql
    username: ${DB_USERNAME:railuser}
    password: ${DB_PASSWORD:railpassword}

    # JDBC — только для Flyway
    jdbc:
      url: ${DB_URL:jdbc:postgresql://localhost:5432/railoptima}

    # Reactive — для Hibernate Reactive
    reactive:
      url: ${DB_REACTIVE_URL:postgresql://localhost:5432/railoptima}
      max-size: 20

  hibernate-orm:
    # Не запускать блокирующий Hibernate ORM из-за наличия JDBC-драйвера
    jdbc:
      enabled: false

    # Схемой управляет Flyway
    schema-management:
      strategy: validate

    log:
      sql: ${HIBERNATE_LOG_SQL:false}

  flyway:
    migrate-at-start: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  log:
    category:
      "api":
        level: ${API_LOG_LEVEL:DEBUG}

smallrye:
  jwt:
    new-token:
      issuer: railoptima
      lifespan: 7200
      signature-algorithm: HS256
    sign:
      key:
        location: ${JWT_JWK_PATH}
    verify:
      key:
        location: ${JWT_JWK_PATH}
      algorithm: HS256

mp:
  jwt:
    verify:
      issuer: railoptima