spring:
  application:
    name: railoptima

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
    info:
      enabled: true

info:
  app:
    name: RailOptima API
    version: 0.1.0
    java:
      version: 25
    spring:
      version: 4.1.1