spring:
  application:
    name: railoptima

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/railoptima}
    username: ${DB_USERNAME:railuser}
    password: ${DB_PASSWORD:railpassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:dev-secret-min-32-characters-long-for-testing-only}
  expiration: 86400000

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    api: DEBUG
    org.springframework.security: INFO